[project]
authors = []
dependencies = []
name = "mcp_testing_oauth"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
mcp_testing_oauth = { path = ".", editable = true }
pyjwt = ">=2.8.0"
cryptography = ">=41.0.0"

[tool.pixi.tasks]
test = "python test_01_external_oauth_basic.py"
isolation = "python test_02_external_oauth_role_control.py"
pat = "python test_03_pat_role_isolation.py"
demo = "python test_04_interactive_demo.py"
agent-test = "python test_04_interactive_demo.py --agent-test"
session-policy = "python test_05_session_policy_secondary_roles.py"
ownership = "python test_06_ownership_and_secondary_roles.py"

[tool.pixi.dependencies]
snowflake-connector-python = ">=4.4.0,<5"
